name: CI

on:
  push:
    branches: [mainline, main]
  pull_request:
    branches: [mainline, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build -o bin/timebound-iam .

      - name: Test
        run: go test -v -race -count=1 ./...
